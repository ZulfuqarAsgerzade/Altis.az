<!doctype html>
<html lang="az">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Altis Admin | Kateqoriyalar</title>
    <link href="../assets/img/altis-icon-32x32.png" rel="icon" type="image/png" sizes="32x32" />
    <link href="../assets/img/altis-icon-192x192.png" rel="icon" type="image/png" sizes="192x192" />
    <link href="css/admin.css" rel="stylesheet" />
    <script src="js/store.js"></script>
    <script src="js/auth.js"></script>
    <script>Admin.auth.require();</script>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar" aria-label="Əsas naviqasiya">
        <a class="sidebar-brand" href="dashboard.html" aria-label="Altis - Bloqlar səhifəsinə keç"><img src="../assets/img/altis-logo-light.png" alt="Altis Group of Companies" width="48" height="75" /></a>
        <div class="sidebar-label">Menyu</div>
        <nav class="nav">
          <a href="dashboard.html">
            <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" /><rect x="14" y="3" width="7" height="5" /><rect x="14" y="12" width="7" height="9" /><rect x="3" y="16" width="7" height="5" /></svg>
            Bloqlar
          </a>
          <a href="categories.html" aria-current="page">
            <svg class="icon" viewBox="0 0 24 24"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8Z" /><circle cx="7.5" cy="7.5" r="1.2" /></svg>
            Kateqoriyalar
          </a>
          <a href="projects.html">
            <svg class="icon" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z" /></svg>
            Layihələr
          </a>
          <a href="settings.html">
            <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z" /></svg>
            Parametrlər
          </a>
          <a href="../index.html" target="_blank" rel="noopener">
            <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18" /></svg>
            Sayta bax
          </a>
        </nav>
        <div class="sidebar-foot">
          <div class="user-chip">
            <span class="avatar" data-user-initials>A</span>
            <div><strong data-user-name>Admin</strong><span data-user-email></span></div>
          </div>
          <nav class="nav">
            <button type="button" data-logout>
              <svg class="icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" /></svg>
              Çıxış
            </button>
          </nav>
        </div>
      </aside>
      <div class="overlay" id="overlay"></div>

      <div class="main">
        <header class="topbar">
          <button class="btn-icon" type="button" id="menuToggle" aria-label="Menyunu aç" aria-expanded="false" aria-controls="sidebar">
            <svg class="icon" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18" /></svg>
          </button>
          <a class="topbar-brand" href="dashboard.html" aria-label="Altis - Bloqlar səhifəsinə keç"><img src="../assets/img/altis-logo.png" alt="Altis" width="26" height="40" /></a>
        </header>

        <main class="content">
          <div class="page-head">
            <div>
              <h1>Kateqoriyalar</h1>
              <p id="pageDesc">Bloqlarda seçilən kateqoriyaları idarə edin.</p>
            </div>
            <button class="btn" type="button" id="addBtn">
              <svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
              Yeni kateqoriya
            </button>
          </div>

          <div class="tabs" role="tablist" aria-label="Kateqoriya növü">
            <button class="tab" type="button" role="tab" id="tabBlog" data-type="blog" aria-selected="true" aria-controls="catPanel">Bloq kateqoriyaları</button>
            <button class="tab" type="button" role="tab" id="tabProject" data-type="project" aria-selected="false" aria-controls="catPanel" tabindex="-1">Layihə kateqoriyaları</button>
          </div>

          <section class="card" id="catPanel" role="tabpanel" aria-label="Kateqoriya siyahısı">
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th scope="col">Ad</th>
                    <th scope="col" id="countHead">Bloq sayı</th>
                    <th scope="col" class="col-actions"><span class="sr-only">Əməliyyatlar</span></th>
                  </tr>
                </thead>
                <tbody id="catRows"></tbody>
              </table>
            </div>
            <div class="empty" id="emptyState" hidden>
              <h3>Kateqoriya yoxdur</h3>
              <p>İlk kateqoriyanı əlavə edin.</p>
              <button class="btn" type="button" id="emptyAdd">Yeni kateqoriya</button>
            </div>
          </section>
        </main>
      </div>
    </div>

    <dialog class="sm" id="catDialog" aria-labelledby="catDlgTitle">
      <form id="catForm" novalidate>
        <div class="dlg-head">
          <h2 id="catDlgTitle">Yeni kateqoriya</h2>
          <button class="btn-icon" type="button" data-close aria-label="Bağla">
            <svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12" /></svg>
          </button>
        </div>
        <div class="dlg-body">
          <div class="field">
            <label for="catName">Ad</label>
            <input class="input" id="catName" maxlength="40" placeholder="Məs: Energetika" required />
            <span class="error-text"></span>
          </div>
        </div>
        <div class="dlg-foot">
          <button class="btn btn-outline" type="button" data-close>Ləğv et</button>
          <button class="btn" type="submit" id="catSave">Yadda saxla</button>
        </div>
      </form>
    </dialog>

    <dialog class="sm" id="confirmDialog" aria-labelledby="confirmTitle">
      <div class="dlg-head"><h2 id="confirmTitle" data-confirm-title>Əminsiniz?</h2></div>
      <div class="dlg-body"><p data-confirm-text></p></div>
      <div class="dlg-foot">
        <button class="btn btn-outline" type="button" onclick="this.closest('dialog').close()">Ləğv et</button>
        <button class="btn btn-danger" type="button" data-confirm-ok>Sil</button>
      </div>
    </dialog>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script src="js/ui.js"></script>
    <script src="js/categories.js"></script>
  </body>
</html>
